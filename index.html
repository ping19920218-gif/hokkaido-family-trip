*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

起飞", "desc": "HB880 09:05 香港起飞，飞行约 5 小时（日本比香港快 1 小时），当地 15:05 抵新千岁。\n带宝宝机上喂奶/睡觉，落地开启北海道。"}, {"time": "15:05", "title": "抵新千岁机场 CTS", "desc": "下飞机办入境、取行李，取车前先给宝宝喂一次奶。\n怎么做：\n• Visit Japan Web 二维码提前办好，入境、海关各扫一次\n• 取行李\n• 到国内线 1F 哺乳室喂一次，再去取车\n关键：入境 + 取行李预计 **45-90 分钟**（周六午后暑期国际线，偏慢）\n宝宝：国内线 1F 有哺乳室；取车要等接送巴士，先喂稳\n注意：排队慢不用慌，租车行和商场都开到 **21:00**"}, {"time": "约16:30-17:15", "title": "取车 + 验装后向婴儿座椅", "desc": "⚠ 视出关顺延：入境走满 90 分钟约 16:35 出关，则取车及之后入住/晚餐/补辅食整条链一起往后推——各店开到 21:00，不慌。\n到日产店办手续付款，把宝宝后向安全座椅装牢再上路。\n地点：日产租车 新千岁机场店\n导航：ニッポンレンタカー 新千歳空港\n地址：千歳市柏台南2-2-5　电话 0123-27-4123\n怎么做：\n• 机场内 1F 日产受付柜台报到\n• 坐免费接送巴士到柏台南营业所（约 5 分）办手续\n• 出示：香港 IDP 小册子 + 香港原驾照 + 护照 + 本人信用卡\n• 当场把后向安全座椅装牢、晃稳再开\n关键：营业到 **21:00**（夏季），与 Day8 还车同店\n费用：到店付 **87,604 日元，约人民币 3,714 元**（含 0 自负额保险 + 座椅 + ETC + 行车记录仪）\n⚠ 你是全程唯一司机，安全座椅这步别省\n注意：入境旺季排队就整体顺延，不用慌（日产、Akachan 都开到 21:00）"}, {"time": "17:15-17:55", "title": "新千岁 → La'gent Stay 新札幌", "desc": "上高速约 40 分钟到新札幌酒店。\n路线：柏台南 → 道央道 → 大谷地 IC 下 → 新札幌\n车程：约 **40 分**（Google Maps 实测 39 分·42.9km）\n高速费：ETC **1,010 日元，约人民币 43 元**（新千岁机场IC→大谷地IC，31.9km/28分，ETC 卡已在车上）\n地址：厚別区厚別中央1条6丁目3-5"}, {"time": "17:55", "title": "La'gent 新札幌 入住", "desc": "办入住，确认婴儿床，把车停连廊直通的停车场。\n地点：La'gent Stay 新札幌\n关键：15:00 后入住 / 11:00 前退房，确认号 64926051646\n宝宝：✅ 婴儿床 + 床围已确认（入住当天放好房间）\n停车：停『D Parking 新さっぽろ駅前駐車場』（导航搜「D Parking 新さっぽろ駅前」），顶棚连廊直通，住客 **1,100 日元/24h，约人民币 47 元**，690 台，**限高 2.2m**\n注意：酒店无自有车场，认准这个连廊直通的"}, {"time": "18:30-19:20", "title": "晚餐就近从简", "desc": "到得晚先吃顿近的，酒店楼连商场里解决。\n地点：Sunpiazza Duo 商场内 寿司店（导航搜「サンピアザ Duo 新さっぽろ」）\n关键：营业 11:00-22:00，**最后点餐 21:00**\n宝宝：商场内有 Baby 护理室（喂奶 + 换尿布）+ 婴儿车租借；寿司店可做初食礼、带娃友好\n可选：B3 美食区；菫味噌拉面（すみれ）留作后面午餐，今天不去\n⚠ 若出关晚于 17:00，直接回酒店安顿吃饭，辅食留饭后或次日补"}, {"time": "19:30-20:30", "title": "🍼 DUO-2 3F Akachan本舗 补辅食", "desc": "晚饭后到楼下母婴店，把全程宝宝辅食补齐。\n地点：阿卡将本舗（Akachan本舗），DUO-2 商场 3F（导航搜「アカチャンホンポ 新さっぽろ」）\n关键：营业 **10:00-21:00**，免税；买 **12-14 份**（1-2 餐/天×8），漏一两天无妨，路上 ツルハ/イオン 能补\n🚨 铁律：不在日本第一次试没吃过的致敏食材——宝宝没吃过鱼/虾/小麦/芝麻\n注意：日本辅食爱放金枪鱼（まぐろ）/白鱼（しらす）/乌冬（うどん），买前翻日文成分避开\n可选：具体买什么见下方「宝宝当日重点 → 辅食采购表」"} 9:00-15:00**，营业期 **4月末-9月末**，定休每周四（D2 周日不撞定休）\n导航搜「お食事処 中村屋」（積丹海胆店），官网 nakamuraya.co\n费用：\n• 选定赤海胆盖饭（虾夷马粪海胆）**约 10,800 日元起，约人民币 458 元（时价·2026/6 实测·旺季可达 13,000+）**——7 月渔期顶配最肥，海胆季例外（7 月中旬更肥，7/5 开季初期已好吃）\n• 紫海胆盖饭 **约 7,000 日元，约人民币 297 元（时价）**，留作实惠备选\n带娃：独栋、榻榻米席间隔宽，可把宝宝放身边坐着喂，比柜台店舒服\n🅿 停车：门口免费，表（前）+裏（后）两个场，可推车进店\n⚠ 不接受预约（赤海胆丼限量、排队制）——7 月周六 11 点满车，我们周日 11:30 到也早去，满了不死等\n可选：满车备选 お食事処 みさき（积丹海胆名店·渔师直营·停车 27 台·营业 9:00-15:00·定休第2・第4周三（7/5周日不撞）·柜台席带娃应急·7 月营业 4/28-10 月末·导航搜「お食事処 みさき」·☎0135-45-6547）"}, {"time": "12:30-13:15", "title": "島武意海岸", "desc": "📍 **Google Maps 搜「積丹岬・島武意海岸駐車場」**（隧道、展望台跟着停车场走，不用单独搜）\n🎯 怎么玩：中村屋吃完就在旁边、顺道。穿过一条 30m 的昏暗短隧道（以前人力凿来运鲱鱼的），出口豁然开朗——100m 高断崖展望台俯瞰积丹蓝，海水清得见底，是积丹蓝的另一个经典机位。\n🚶 路线：停车场（免费 80 台、有厕所）→ 走 30m 短隧道 → 展望台俯瞰 → 原路返回。\n⏱ 时长：停车场到展望台不到 5 分 + 看景拍照约 15 分 = 合计约 15-20 分（很短，顺道一看）。\n👶 带娃·注意：步行很短，婴儿车能推（隧道偏暗、慢点走）。\n⚠ 下海滩的步道 2023 年起塌了、不能下到海边，只能在展望台俯瞰，别白跑下去；出发前复查积丹观光协会。"}, {"time": "🔵可选", "title": "🔵[可选·回程顺道] 美国港 水中展望船", "desc": "📍 **Google Maps 搜「積丹水中展望船 ニューしゃこたん号」**\n🎯 怎么玩：积丹半岛的玻璃船底观光船，从美国港出发绕近海一圈，透过船底玻璃看清透见底的积丹蓝海水、海底礁石和鱼群，海面远观黄金岬、海鸥岛、宝岛等海蚀奇岩。是「上午积丹玩得顺、还有富余时间」才加的回程顺道项——回程島武意→余市→小樽正好路过美国港。\n🚶 路线：停美国港乘船处停车场（导航搜『積丹水中展望船 ニューしゃこたん号』）→ 乘船处买票上船 → 玻璃船底绕近海一圈 → 原船回到美国港。\n⏱ 时长：买票候船约 10 分 + 航程约 40 分 = 合计约 50-60 分（每 50-60 分一班，错过等下一班）。加这一站，小樽段会缩水约 1 小时，权衡好再去。\n👶 带娃·注意：玻璃船有顶棚船舱，宝宝可抱在舱内看船底玻璃，吹不到海风；带 8-9 月龄宝宝上船先在乘船处确认有婴儿尺寸救生衣。航程仅 40 分，上船前先喂饱、换好尿布。\n⚠ 营业 4 月下旬-10 月下旬（7 月运营）、9:00-16:30；天气恶劣/浪大停航——和神威岬同一片海，上午要是风大，这船多半也停。费用大人 1,600 日元（约人民币 68 元）/小人 800 日元（约 34 元）。不去就直接島武意→小樽，不耽误。"}, {"time": "13:15-14:30", "title": "积丹 → 小樽", "desc": "沿海岸开往小樽，路况慢按 90 分留 缓冲。\n路线：R229 → 余市 → R5\n车程：约 **75 分**（实测 1h14·59.6km·国道229＋5号）\n距离：约 **70km**\n宝宝：车上睡下午觉"}, {"time": "15:00-17:30", "title": "小樽运河 + 堺町通 + 北一硝子三号馆", "desc": "📍 **Google Maps 搜「小樽運河」**（停车搜「小樽堺町通り商店街駐車場」，玻璃馆搜「北一硝子三号館」）\n🎯 怎么玩：小樽经典半日游，先逛会关门的玻璃馆和商店街，最后到运河拍傍晚光线。北一硝子三号馆是小樽玻璃招牌（和式、洋式、休闲三层加石油灯咖啡馆）；堺町通是 900m 边吃边逛的老商店街；运河浅草桥是「到了小樽」的标志机位。\n🚶 路线（按关门时间排）：停车场（堺町通商店街停车场）→ 北一硝子三号馆（18:00 关，先去）→ 堺町通一路吃走、拍街景（往运河方向）→ 小樽运河浅草桥傍晚拍照 → 取车。\n⏱ 时长：北一硝子 30-40 5km 笔直起伏的农道，最大落差 65 米、3 个大起伏，开车冲上冲下、正面十勝岳连峰，是北海道经典兜风路。\n🚶 路线：15:00 从日出公园开约 10 分到此，走过山车之路一个来回、沿途随停拍照。\n⏱ 时长：约 40 分（兜风 + 随停拍照）。开完往西去千望峠（约 10 分）。\n👶 带娃·注意：开车体验为主、宝宝车上坐着/睡；路两侧是私人农田，停车拍照别进田。\n费用：免费。"}, {"time": "16:00-16:30", "title": "🏔️ 千望峠（かみふらの八景·俯瞰全景）", "desc": "📍 **Google Maps 搜「千望峠」**（千望峠駐車公園）\n🎯 怎么玩：上富良野八景之一，从国道237 以观音像为标志拐进道道581、几分钟到。展望台在盆地高处，**俯瞰整个富良野盆地 + 十勝岳连峰大全景**——下午这几个点里视野最开阔的一处。\n🚶 路线：过山车之路开完往西约 10 分到此 → 駐車公園停车 → 展望台看全景拍照 + 喂奶 → 返车。\n⏱ 时长：约 30 分（看景拍照 + 喂奶/换尿布）。\n👶 带娃·注意：駐車公園平地，宝宝抱下看景；无母婴设施，喂奶车内解决。\n🅿 停车：駐車公園免费。\n费用：免费。"}, {"time": "16:35-17:05", "title": "🛣️ パノラマロード江花（八景·5km 直线下坡兜风）", "desc": "📍 **Google Maps 搜「パノラマロード江花」**\n🎯 怎么玩：上富良野八景之一，与千望峠同在道道581、顺路捎带。盆地高约 50m 的丘上、一条 **5km 笔直下坡**的田园直道，开下去正对富良野盆地，是经典兜风路。\n🚶 路线：千望峠出来沿道道581约 5 分到江花起点 → 开下 5km 直道、沿途随停拍照 → 接道路南下返富良野。\n⏱ 时长：约 30 分（兜风 + 随停拍照）。\n👶 带娃·注意：开车体验为主、宝宝车上坐着/睡；两侧是私人农田，停车拍照别进田。\n🅿 停车：路肩临停。\n费用：免费。"}, {"time": "17:05-18:00", "title": "🚗 返富良野 + 喂奶换尿布", "desc": "江花南下回富良野市区约 30 分。到富良野站一带，车内或餐厅前给宝宝喂奶换尿布，接晚餐。\n车程：约 30 分（约 25km，国道237 南下）\n宝宝：返程途中或到站喂奶换尿布（17:20 一次）"}, {"time": "18:00-19:30", "title": "🍲 晚餐：熊啄木鸟（くまげら·富良野乡土料理）", "desc": "📍 **Google Maps 搜「くまげら」**（富良野駅徒步 3 分）\n🎯 怎么玩：富良野人气**乡土料理店**（「北の国から」拍摄地），晚上吃乡土料理配富良野酒最对味。\n🍽 招牌（人气排序）：**① 山贼锅（山ぞく鍋）**——鹿肉/鸭肉/鸡肉 + 本地蔬菜白味噌锅（一人前 1,900 日元约 81 元 / 二人前 3,400 日元约 144 元）；**② 和牛烤牛肉盖饭** 2,000 日元（约人民币 85 元）——富良野产和牛西冷；③ 乳清蛋包咖喱（ホエーオムカレー）1,250 日元（约 53 元）只是其中一道、非招牌。\n关键：营业 **11:30-22:00 L.O（周三定休，今天周一 ok）**；19:00 后易排队、早点到。\n🅿 停车：店周边投币停车场。\n宝宝：2F 榻榻米席/个室共 170 席，带娃宽松；自带辅食为主。"}, {"time": "19:30", "title": "入住 La Vista富良野Hills + 喂奶", "desc": "晚餐后入住，行李进房，喂奶洗睡。\n地点：La Vista富良野Hills\n关键：行李全程车上、晚餐后一次性入住（15:00 后可入住，今天玩满到晚餐、入住放最后）\n宝宝：酒店房间喂奶、睡前一次"}], "hotel": {"name": "富良野，La Vista富良野Hills（已订，纯住宿不含餐）"}, "feeding": [{"time": "08:00", "place": "酒店（退房前喂饱再出发）"}, {"time": "09:20", "place": "公路驿站（道の駅）三笠（中途换尿布为主，按需喂）"}, {"time": "11:15", "place": "花园乐园（无母婴室→车内/哺乳巾）"}, {"time": "14:15", "place": "日出公园/过山车之路（车内/哺乳巾）"}, {"time": "17:20", "place": "返富良野途中/到富良野站（车内喂奶换尿布）"}, {"time": "18:00", "plac , "La Vista富良野晚餐后入住（15:00后可入住，行李全程车上）"], "risks": ["约11:00到上富良野（车程2h10+道の駅三笠停留）——不进市区直接北上，午前玩两大精华花田（光线好、避下午旺季人潮）", "下午日出公园+过山车之路+千望峠+江花都在上富良野西侧、彼此5-10分顺路兜风（看不同角度的十勝岳田园）——雨天/宝宝睡可减兜风点直接南下回富良野", "日出公园 2026薰衣草节7/4-12仅土日夜间18:30-22:00管制（白天山顶自驾未见禁止）——7/6周一白天大概率可自驾上顶，保险起见行前电话确认0167-45-6983", "带娃走不动上不了日出公园山顶——第1停车场旁平地花田+商店也能看紫坡", "花园乐园雨天/宝宝睡着不便下车——改开车走免费「过山车之路」远观", "富良野市区餐厅19:00后易排队——熊啄木鸟早点去；周三定休，今天周一ok"], "baby_daily": {"prepare": "宝宝奶/水/换洗、背带（日出公园山顶/八景兜风下车用）、行李全程留车上", "buy": "", "diaper": "道の駅三笠（中途换尿布）、花园乐园/日出公园花田景点无专用母婴→车内或哺乳巾、酒店房间", "avoid": "", "food_table": []}}, {"n": 4, "date": "2026-07-07", "dow": "周二", "title": "富田早场 + 中富良野，美瑛中部", "theme": "抢富田8:30黄金窗口，再一路向北把中富良野+美瑛中西的花田/牧场/丘陵串完——第二带：中富良野→美瑛中部。", "items": [{"time": "08:00-08:15", "title": "富良野 → 中富良野 富田农场（ファーム富田）", "desc": "08:00 出发去富田，约 08:15 到、等 15 分赶 8:30 开门第一波进（平日不必更早干等）。\n路线：富良野 → 中富良野 富田农场（ファーム富田）\n车程：约 **15 分**（实测 12 分·9.1km）\n关键：早到抢核心车位、赶在 **10 点**旅游大巴潮前\n7 月旺季 10 点后停车渐紧——**周末/盛期峰值**才车列延国道 237 数公里、等位 1 小时+，**7/7 平日轻不少**；富田官方 8:30 开门、8 点前进不去，**8:30 开门即到最从容**（旺季设町内临时停车场 + 部分日免费接驳）\n宝宝：出发前 / 车内喂一次\n⚠ 早饭外面买/便利店带走上车吃（不在酒店吃，富田早场也来得及）"}, {"time": "08:30-10:20", "title": "🌾 富田农场（ファーム富田）", "desc": "📍 **Google Maps 搜「ファーム富田」**\n🎯 怎么玩：富良野薰衣草招牌、北海道夏天的明信片场景，入园全免费。核心看几片花田：进门的「幸之田」深浅渐变薰衣草、山坡「彩之田」七色花带（配森之舍观景台俯瞰）、规模最大的「传统薰衣草田」（坡顶月牙形瞭望点远眺富良野盆地和十勝岳）。7/7 在见顷入口、深浅同框，盛开高峰要等 7 月中旬。出发前查官网花田日记确认花况。\n🚶 路线：停车场（约 500 台、免费）→「幸之田」+ 香水之舍（先看）→ 上「传统薰衣草田」爬坡到坡顶瞭望点 →「彩之田」+ 森之舍观景台 → **再往上「山之彩之田」（罂粟 ポピー 为主）+「白桦之森」** → 进「花人之舍」购物休息喂奶 → 返车。园内一圈约 1.5-2 小时。\n⏱ 时长：核心花田拍摄 50-60 分 + 爬坡瞭望 20 分 + 花人之舍休整喂奶 20-30 分 + 山之彩之田/白桦森约 15-20 分 = 合计约 110 分，对齐 8:30-10:20。早场人少光好。\n🌺 山之彩之田以罂粟（ポピー）为主、见頃 **7 月中下旬**——你们 **7/7 未必盛开**（可能只有零星早花），行前查富田官网花田日记；没开就当看白桦之森 + 畑顶俯瞰十勝岳连峰，白桦林全季都好看，不强求。\n👶 带娃·注意：「花人之舍」二楼有授乳室（椅子、遮光、可上锁、有插座，婴儿车可进），一楼有储物柜（500 日元约 21 元）。园内有免费婴儿车租借但很少、先到先得不能预约，想用一进园先去花人之舍问。商店区平路好推车；上传统薰衣草田是带坡土路、碎石卡轮，建议换背带。\n⚠ 官方营业 **8:30-17:30**（营业时间外不可入园、8 点前进不去）。停车高峰 10:00-14:00（大巴+游客）；**周末/盛期峰值**才会车列延国道 237 数公里、等位 1 小时+，**7/7 是平日会轻不少**。**8:30 开门即到最从容**——是开门时间、不是「抢车位」，不必极端早起。"}, {"time": "10:25-11:10", "title": "💜 薰衣草东园（ラベンダーイースト）", "desc": "📍 **Google Maps 搜「ファーム富田 ラベンダーイースト」**（薰衣草东园，与本园相隔约 4 公里）\n🎯 怎么玩：富田旗下、距本园约 4 公里的独立分园，日本最大薰衣草田（约 9 万株单种薰衣草铺满整片缓坡），气势和本园精致花田不同——这里是「一望无际的紫」。入园免费。只在花期短期开放，2026 开放 6/20-7/20，7/7 在窗口内接近盛开。\n🚶 路线：从本园开车约 7 分到东园 → 停车场（普通车 73 台、免费）→ 售店一带平路 → 坐薰衣草巴士绕花田一圈 → 返车。\n⏱ 时长：本园开过来 7 分 + 坐巴士看花一圈 15-20 分 + 上下车拍照 15 分 = 合计约 40-45 分，对齐 10:25-11:10（含富田→东园 7 分车程）。\n👶 带娃·注意：大面积缓坡花田、土路草坡，推车进花田费力——最省力是坐薰衣草巴士（拖拉机拖挂座席车厢，绕一圈 15-20 分，坐着看全景），大人 500 日元（约 21 元）、3 岁以下免费，婴儿车留平路用。园内有厕所。东园授乳室官网未明确（本园在 4 公里外），喂奶按需车内解决。\n⚠ 营业 9:30-16:30，只在 6/20-7/20 开放，出发前再确认没因天候变更。"}, {"time": "11:10-11:40", "title": "→ 美瑛 千代田农场", "desc": "开车转去美瑛千代田农场。\n路线：中富良野 → 美瑛春日台\n车程：约 **30 分**（实测 29 分·22km·国道237）"}, {"time": "11:40-13:15", "title": "🐄 千代田午餐+喂动物", "desc": "📍 **Google Maps 搜「ファームズ千代田」**\n🎯 怎么玩：这站是午餐 + 亲子互动牧场（餐厅另见午餐）。互动牧场能近距离看、喂一群小动物：道产子马、小马、绵羊、山羊、兔子、泽西奶牛，还有羊驼。对 8-9 月龄宝宝是很好的「看动物」体验——抱着隔栏看、大人代喂。额外加购喂食饲料 100 日元一份（约人民币 4 元）。\n🚶 路线：餐厅吃午饭 → 隔壁互动牧场喂小动物一圈 →（有精力可上千代田之丘展望台）→ 返车。\n⏱ 时长：午餐约 60 分 + 牧场喂动物 20-30 分 = 合计约 95 分，对齐 11:40-13:15。\n👶 带娃·注意：这天母婴设施最齐的点——餐厅有授乳室（哺乳 + 喂辅食都舒服）。牧场喂食围栏区平地、婴儿车可推；上千代田之丘展望台有坡，抱娃上、可选。让大人喂动物、宝宝旁观别直接摸，喂完洗手。\n🅿 停车：免费约 100 台·亲子向平地·推车方便\n⚠ 餐厅平日 11:00-16:00（L.O.15:30）、土日 11:00-18:00（7/7 周二在内）；互动牧场营业 9:00-17:00、年中无休。2026/6/1 起新增入场费：中学生以上 500 日元（约人民币 21 元）、4 岁-小学 300 日元（约人民币 13 元）、3 岁以下免费（宝宝免），含喂食饲料 1 袋。"}, {"time": "13:30-15:00", "title": "🚜 四季彩之丘", "desc": "📍 **Google Maps 搜「四季彩の丘」**\n🎯 怎么玩：美瑛最有名的「彩虹花田」——一条条不同颜色的花带顺起伏丘陵排开，像铺在坡上的七彩条纹，背景是大雪山。7 月上旬金鱼草、石竹、矮牵牛、向日葵、薰衣草、鼠尾草、万寿菊都在开，彩虹条纹已成形（约六七成，全盛在 8 月上中旬）。\n🚶 路线：停车场（普通车 500 日元约 21 元）→ 售票区（铺装路）→ 坐展望小火车绕园一圈看彩虹花带 →（想下车近看就在主区花田走走）→ 返车。\n⏱ 时长：坐小火车绕园 15 分 + 上下车买票 + 主区花田散看 30-40 分 = 合计约 60-75 分，对齐 13:30-15:00。\n👶 带娃·注意：入场协力金高校生以上 800 日元（约 34 元）、小中学生 500 日元、未就学幼儿免费（宝宝免）。花田是天然草地缓坡有起伏，推车费力——最省力是坐展望小火车（绕一圈 15 分，宝宝抱腿上坐），大人 500 日元（约 21 元）、小学未満免费，只收现金备零钱；下车近看用背带。停车场到主服务区铺装路好推车。园内有尿布台。\n⚠ 营业 8:40-17:30（7-9 月最终入园 17:15）。羊驼牧场要单独买票（高校以上 500 日元、小中学生 300 日元），带这么小的宝宝配合不了、跳过没损失。小火车旺季要排队、可能等 1-2 班，午后挑人少的班次上。"}, {"time": "15:20-16:30", "title": "🛣️ 拼布之路兜风（开车不下车）", "desc": "📍 **Google Maps 搜「ケンとメリーの木」「セブンスターの木」**（两棵树各自是地点；柔和七星之丘搜「マイルドセブンの丘」定位到这一带）\n🎯 怎么玩：美瑛西北丘陵的「拼布之路」，开车兜风看小麦（绿转金黄）、马铃薯花（白）、豆田拼成像拼布的彩色坡地，7 月上旬色彩最丰富。沿途三处招牌「树」短停拍照：肯与玛丽之树（约 31 米高百年白杨，1976 日产 Skyline 广告取景）、七星之树（七星香烟包装取景的孤树）、柔和七星之丘（防风林丘陵剪影）。\n🚶 路线：开车环线短停，顺序大致 肯与玛丽之树 → 七星之树 → 柔和七星之丘（三点加美瑛站起点约 29 公里、纯行车约 40 分，沿途随停）。肯与玛丽之树有约 20 台免费停车；七星之树有专用停车；柔和七星之丘无专用停车、只能路肩临停。\n⏱ 时长：每点下车看树拍照 5-10 分 + 点间车程 8-10 分 = 合计约 60-75 分，对齐 15:20-16:30（四季彩开来约 20 分）。基本「停车-拍照-上车」，娃车上睡不耽误。\n👶 带娃·注意：三个点都是停车场/路边直接看树拍照，几乎不用走路，最适合带娃短停，宝宝车上睡、到点抱下看一眼。但三处都没有厕所，出发前在美瑛市区或道路休息站「丘之藏」先换尿布、上厕所、带够尿布。\n⚠ 树周边都是私人农田、严禁进入踩踏（美瑛「哲学之木」就因游客闯田踩作物、2016 被农家砍掉永久消失）。另：柔和七星之丘原排防风林 2019 起已大幅砍伐、现仅余约 5 棵 + 无专用停车，建议当「顺路扫一眼」而非主力点，时间紧可略过、把时间留给前两棵树。"}, {"time": "16:30-17:30", "title": "返富良野 + 喂奶", "desc": "返富良野并把油加满。\n车程：约 **45 分钟**\n🛢 傍晚返富良野时在市区国道 38 沿线加满油（ENEOS / 出光）\n关键：全程唯一中途加油，确保 **D6 转场前满油**（D5 不必再加，D8 千岁还车前再满一次）\n注意：今天忘了 → 最迟 **D5 傍晚**补\n宝宝：返程途中喂奶"}, {"time": "18:00", "title": "🍛 晚餐：唯我独尊（富良野咖喱名店）", "desc": "晚餐定唯我独尊，吃富良野咖喱名物（蛋包咖喱），跑一天后犒劳一顿。\n地点：唯我独尊（富良野咖喱名物，蛋包咖喱（オムカレー））\n地址：日の出町 11-8\n关键：7 月 **11:00-21:00** 连续营业（最后点餐20:30）、**周一定休（今天周二 ok）**；オムカレー（蛋包咖喱）1,130 日元约 48 元——趁今天有精力体验\n注意：名店晚市易排队——18:00 早点到避高峰、错峰更稳。"}], "hotel": {"name": "富良野，La Vista富良野Hills（已订，纯住宿不含餐）"}, "feeding": [{"time": "07:30", "place": "酒店（出发前喂饱，08:00 出发）"}, {"time": "10:30", "place": "富田/薰衣草东园（花人之舍哺乳室或车内）"}, {"time": "12:30", "place": "⭐千代田农场餐厅哺乳室（午餐·这天设施最齐）"}, {"time": "15:30", "place": "四季彩/拼布之路（车内/哺乳巾）"}, {"time": "18:00", "place": "酒店/晚餐"}, {"time": "睡前", "place": "酒店房间"}], "map": [{"label": "La Vista富良野", "lat": 43.347, "lng": 142.388, "kind": "hotel"}, {"label": "富田农场", "lat": 43.4197, "lng": 142.475, "kind": "sight"}, {"label": "薰衣草东园", "lat": 43.438, "lng": 142.505, "kind": "sight"}, {"label": "千代田农场", "lat": 43.536, "lng": 142.523, "kind": "food"}, {"label": "四季彩之丘", "lat": 43.5917, "lng": 142.475, "kind": "sight"}, {"label": "七星之树", "lat": 43.623, "lng": 142.448, "kind": "sight"}, {"label": "回富良野", "  "title": "💧 青池 + 白须瀑布", "desc": "📍 **Google Maps 搜「青い池」**（白须瀑布搜「白ひげの滝」，停车搜「白金観光センター」）\n🎯 怎么玩：白金山区招牌的两处「蓝水」景点，挨在一起顺道连看。青池是十勝岳火山地下水含铝、与美瑛川泥沙作用形成的钴蓝色水池，枯立落叶松倒映水面，是北海道最出片的画面之一；清早无风时倒影最清，排在 9 点抢在 10 点大巴潮前。白须瀑布在上游约 4 分车程，是少见的「潜流瀑」——地下水从悬崖溶岩裂缝像白胡子直接渗出、落差约 30 米，注入美瑛川正是那条「蓝河」的源头。\n🚶 路线：先到青池——停「青池停车场」（导航搜 青い池駐車場），走铺装步道单程约 2 分到水池边，沿池边平缓步道走外侧一圈看倒影拍照、原路返回。再开 4 分到白须瀑布——停「白金观光中心」对面免费停车场，步行 2-5 分到「白须瀑布桥」（白金桥，别名蓝河桥），站桥上俯瞰瀑布（没有下到河边的路，桥上看）。\n⏱ 时长：青池往返加看景拍照约 30-40 分 + 转场车程约 5 分 + 白须瀑布往返约 10-15 分 = 合计约 1 小时，对齐 9:00-10:05。\n👶 带娃·注意：青池步道是平缓铺装 + 局部碎石/木屑，推车基本能推，碎石段颠就换背带；池边和桥上户外没母婴室，喂奶换尿布回车内（自带哺乳巾）。白须瀑布只在桥上俯瞰、走得很短。两处都暴露户外、山区清早凉、带薄外套；池边没自动贩卖机、水自带。\n⚠ 青池停车场 7 月 7:00-19:00；停车费 2026/7/1 起官方上调普通车 1,000 日元/次（约 42 元）、270 个车位——这是新规，比旧攻略写的 500 贵；务必赶在 10 点大巴团到达前到。"}, {"time": "10:20-11:20", "title": "⛰️ 十勝岳望岳台", "desc": "📍 **Google Maps 搜「十勝岳望岳台」**\n🎯 怎么玩：海拔 930 米的火山观景台，就在大雪山国立公园十勝岳主峰正下方，是「不用登山就能看大雪山级景色」的性价比之王。下车几步就能俯瞰从旭川到富良野的 360 度全景，正面是十勝岳/美瑛岳的火山峰、脚下是黑色凝固熔岩荒原。台上还有一座 2016 年建的防灾避难所（十勝岳是活火山），屋顶也能登上去看景。\n🚶 路线：从青池往白金温泉方向上山约 20 分车程到顶，停「十勝岳望岳台」停车场（50 台、免费、含大巴位）。展望台就在停车场旁——下车沿一小段缓上坡走几步到「望岳台」石碑和 360 度观景点。体力好可走旁边约 1.1 公里散策小径（约 15 分，走在熔岩间）。\n⏱ 时长：停车场到石碑几分钟 + 看景拍照 20-30 分 = 核心约 30-40 分；加走散策小径再 +15-20 分，对齐 10:20-11:20。\n👶 带娃·注意：地面是凹凸不平的火山熔岩碎石，推车基本推不动（有家长实测一岁娃在碎石上走不顺），直接背带背宝宝最省事；穿运动鞋。台上开阔高地、风大且凉，给宝宝加外套、帽子注意别吹飞。喂奶换尿布回车内或利用避难所空间。走不动的备选：只在石碑观景点看 360 度全景就够本，散策小径可省。\n⚠ 山顶云雾遮顶概率不低，看不到十勝岳山体很正常——看不到就当 360 度俯瞰也值，山景留下午美瑛丘陵补，不死等天气。"}, {"time": "12:00-13:15", "title": "美瑛市区午餐", "desc": "到美瑛市区吃午餐，带娃优先选道の駅。\n车程：望岳台 → 美瑛市区约 **35 分**（约 25km·山区下行；原「白金→美瑛 20 分」按白金温泉起算有误，上一站其实是更上方的望岳台）\n地点：道の駅 美瑛「丘のくら」（主推）\n关键：道の駅 6-8月 **9:00-18:00**；**香麦食堂 11:00-15:00（L.O.14:30）**·带娃快·物産食堂\n可选：bi.ble（米其林一星，周二休息日/D5 周三营业，套餐 较慢，带娃需娃配合，☎ **0166-92-8100**）——想精致的备选\n注意：特种兵带娃节奏建议道の駅更顺\n🅿 停车：道の駅 美瑛「丘のくら」免费仅 36 台（小驿站·旺季中午可能等位）"}, {"time": "13:30-16:15", "title": "🌄 美瑛丘陵兜风（全景之路パノラマロード）", "desc": "📍 **Google Maps 搜「三愛の丘展望公園」「新栄の丘展望公園」**（兜风沿途两个展望公园）\n🎯 怎么玩：美瑛南侧「全景之路」沿线的波状丘陵兜风线，开车看一望无际的起伏农田拼布、远眺十勝岳连峰与旭岳，是美瑛丘陵风光的精华带。以开车观景为主、下车短停几个展望公园拍照，接在上午山岳行程后做个轻松午后段，宝宝多半车上睡。\n🚶 路线：从美瑛市区沿全景之路串三个免费展望点，开车观景为主、各点下车短停——三爱之丘展望公园（缓丘全景、能望大雪山十勝岳、有凉亭厕所）→ 新荣之丘展望公园（中段、360 度看丘陵、**＝攻略说的「超広角之路」全景制高点·视野最开阔**、西侧著名夕阳机位、有厕所停车场）→ 千代田之丘见晴台（展望塔为标志、俯瞰千代田农场和水库）。看完黄昏自然折返富良野。\n⏱ 时长：三点各停 15-25 分（含开车移动）+ 点间兜风车程 = 慢看 + 下车走三愛之丘/新栄之丘展望公园步道，从容约 2h45、对齐 13:30-16:15，之后去拓真館白桦回廊（16:15 出发）；宝宝睡得沉也可只下 1-2 点、其余路过看。\n👶 带娃·注意：核心是「开车不下车」兜风，宝宝车上睡最合适，下车的展望公园都是平整草地 + 铺装小广场、短距离，推车或抱着都轻松。三爱之丘、新荣之丘有厕所，喂奶换尿布车内（户外无母婴室）。体力消耗很低，是上午山岳后的缓冲。\n⚠ 三个展望点都免费、停车免费、无营业限制；丘陵农田多为私人耕地，下车看景勿进田、勿踩作物。"}, {"time": "16:30-17:00", "title": "🌳 拓真館·白桦回廊（不看展也值）", "desc": "📍 **Google Maps 搜「拓真館」**（美瑛·四季彩之丘旁）\n🎯 不进摄影馆也值——核心是**白桦回廊**：250m、2,300 棵白桦笔直林道，慢走约 10 分、口碑很高（绿荫木漏れ日、只有风与树叶声的寂静）；另有庭园小径 + 7 月周边麦田/薯花/薰衣草丘陵。\n🚶 兜风开来约 15 分到 → 白桦回廊散步 + 庭园 → 17:00 准点启程返富良野。\n⏱ 时长：约 30 分（白桦回廊 + 庭园慢走 + 喂奶）。\n👶 带娃·注意：白桦回廊平整好走、推车/背带都行；前田真三摄影馆免费、可顺看可不看。\n🅿 免费停车。\n⚠ 营业 10:00-17:00（**17:00 关门、务必准点走**赶 18:00 晚餐）。"}, {"time": "17:00-18:00", "title": "🚗 拓真館 → 富良野（17:00 启程）", "desc": "拓真館白桦回廊后 17:00 准点启程，返富良野市街丘上的 ふらのワインハウス；约 17:50 到、18:00 晚餐。\n路线：拓真館（美瑛南）→ 富良野市街\n车程：约 45-50 分（行前导航复核）\n宝宝：返程途中喂奶换尿布"}, {"time": "18:00", "title": "🍷 晚餐：ふらのワインハウス（富良野最后一晚）", "desc": "📍 **Google Maps 搜「ふらのワインハウス / Furano Wine House」**（富良野市街丘上）\n🎯 富良野 3 晚收尾——丘上落地窗俯瞰富良野盆地田园 + 十勝岳连峰全景，吃富良野在地物产。\n🍽 招牌：**チーズフォンデュ（起司火锅）**——富良野起司 + 富良野白葡萄酒慢炖、连面包都能吃（2-3 人 1,998 日元 / 1 人 972 日元）；另有富良野和牛牛排、和牛红酒炖、起司披萨、虾夷鹿肉意面，配富良野葡萄酒。\n⭐ 食べログ **3.44**（186 评）·晚餐人均约 **3,000 日元（约 127 元）**。\n关键：营业 **11:00-21:00、无定休**（周三 ok）；傍晚丘上看夕阳田园。\n👶 起司火锅酒精充分挥发、小孩可安心吃；带娃宽松。\n🅿 免费停车。"}], "hotel": {"name": "富良野，La Vista富良野Hills（已订，纯住宿不含餐）"}, "feeding": [{"time": "07:30", "place": "酒店（出发前喂饱，08:00 出发）"}, {"time": "11:00", "place": "望岳台/青池（无母婴室→车内哺乳）"}, {"time": "14:00", "place": "美瑛丘陵兜风（车内）"}, {"time": "17:00", "place": "拓真館后 / 返富良野途中（车内喂奶换尿布）"}, {"time": "睡前", "place": "酒店房间"}], "map": [{"label": "La Vista富良野", "lat": 43.347, "lng": 142.388, "kind": "hotel"}, {"label": "青池", "lat": 43.4925, "lng": 142.641, "kind": "sight"}, {"label": "白须瀑布", "lat": 43.473, "lng": 142.653, "kind": "sight"}, {"label": "十胜岳望岳 、背带(西山+金比羅火口散策路户外步道用)、车上睡眠安抚(转场长)", "buy": "", "diaper": "かなやま湖(户外→车内/哺乳巾)、ぷらっとみなと市场(市场内)、西山+金比羅火口散策路(户外→车内/ビジターセンター)、洞爺湖畔、旅馆房间；高速 SA/PA 中途换尿布", "avoid": "", "food_table": []}}, {"n": 7, "date": "2026-07-10", "dow": "周五", "title": "洞爷湖，有珠山缆车 + 游船", "theme": "缆车视野主轴 + 游船看火山岛 + 浮見堂朱红湖景，温泉弹性慢活——景点日。", "items": [{"time": "07:45-09:45", "title": "早餐 + 洞爷湖畔", "desc": "先在旅馆吃早餐、湖畔散步看晨景，再出发去缆车。\n地点：湖畔亭\n关键：自助餐 早餐 **7:00-9:00**（**8:30 最后点餐**）\n怎么做：\n• 旅馆吃 自助餐 早餐\n• 早餐后湖畔散步看晨景\n• **09:45** 出发去缆车\n宝宝：前台可热辅食"}, {"time": "10:00-12:00", "title": "🚠 有珠山缆车 + 昭和新山", "desc": "📍 **Google Maps 搜「有珠山ロープウェイ」**（山麓站，昭和新山就在旁边）\n🎯 怎么玩：洞爷一带视野最开阔的一站。从昭和新山旁的「昭和新山山麓站」坐缆车（全长 1.37 公里、片道约 6 分）升到有珠山山顶，上下不用爬山。山顶有两个观景台：出站旁就是「洞爺湖展望台」，一眼俯瞰洞爺湖、羊蹄山、脚下红褐色的昭和新山；沿铺装步道再走约 7 分到「火口原展望台」看 1977 年喷火留下的火口原。上午光线好、人比午后团少，10 点正合适。\n🚶 路线：车停山麓站停车场（约 400 台、500 日元约 21 元/日）→ 山麓站「火山村」复合楼买票上缆车 → 山顶站出站即「洞爺湖展望台」拍全景 → 想多看就沿铺装步道走约 7 分到「火口原展望台」→ 原路坐缆车下山。山麓站「火山村」有食堂和土产店可逛可吃。\n⏱ 时长：上行缆车 6 分 + 洞爺湖展望台拍照约 15 分 +（可选）来回火口原步道约 15-20 分 + 下行缆车 6 分 + 火山村逛 15-20 分 = 合计约 60-75 分，对齐 10:00-12:00。\n👶 带娃·注意：缆车车厢平进平出，背宝宝直接进无门槛。「洞爺湖展望台」在山顶站旁、铺装平地，婴儿车能推；到「火口原展望台」步道是铺装缓坡，背带更省心。再往里的「外輪山展望台」有坡度、婴儿车不可，走不动就只看出站旁的洞爺湖展望台即可、景观已够。火山村食堂/店内可坐下喂奶换尿布。山顶风比山下大，给宝宝带薄外套帽子。\n⚠ 缆车夏季 8:15-17:45（下行末班），每 15 分一班，正常无需预约。往复票 2,000 日元（约人民币 85 元）/小学 1,000 日元（约人民币 42 元）。出发前一晚可再确认当日运营（电话 0142-75-2401）。"}, {"time": "12:15-13:15", "title": "🍽 午餐：海鮮ダイニング 龍（噴火湾扇贝丼）", "desc": "📍 **Google Maps 搜「海鮮ダイニング龍」**（洞爺湖温泉 40-10·温泉街内·电话 0142-82-3744）\n🎯 怎么玩：洞爺湖町临**噴火湾**——北海道头牌帆立（扇贝）产地，这家当地海鲜食堂主打**噴火湾扇贝丼（ホタテ丼）、生散寿司丼、刺身定食**，帆立艳泽弹牙、甜味浓，比土产店楼上的观光食堂贴当地多。缆车下山约 20 分车程到温泉街，吃完步行/几分钟车程就到游船码头。\n🍽 招牌：**ホタテ丼（扇贝丼）**、生ちらし丼、刺身定食，价格 **1,080-1,500 日元（约 46-64 元）**。\n💡 D6 午餐已吃苫小牧北寄贝丼 → 今天**点扇贝丼/刺身、别再点北寄贝**，就不重复。\n⏱ 时长：约 1 小时（12:15-13:15），吃完去游船。\n👶 带娃·注意：店内有小上がり/掘りごたつ座、座位宽松好带娃（婴儿椅行前确认）。\n🅿 有停车场。\n⚠ 营业 **11:00-14:30**（午餐），**不定休**——行前电话 0142-82-3744 确认当日营业 + 停车 + 带娃座位。"}, {"time": "13:30-15:00", "title": "⛵ 洞爷湖游船，中岛巡游游船", "desc": "📍 **Google Maps 搜「洞爺湖汽船 駅前桟橋」**（别上放烟花的「本社前桟橋」）\n🎯 怎么玩：洞爺湖招牌玩法，坐城堡造型大游船绕湖心「中岛」一圈，在湖上看四面环抱的火山地形（中岛本身是火山喷发堆出来的岛）、远眺羊蹄山。船是洞爺湖最大的城堡造型大游船 Espoir（エスポアール）号（401 吨·定员 700），船身很稳、第一次坐船也不晕；分上下两层、有咖啡甜品小卖部。午餐后乘正好消食看景。\n🚶 路线：从午餐点（海鮮ダイニング龍）开车或步行到「駅前桟橋（站前码头）」（在格兰多洞爺酒店后侧、温泉街内、有免费停车场）→ 上「中岛巡游」船 → 不下船绕中岛一圈约 50 分原船返回。认准站前码头的中岛巡游船，别上「本社前码头」那班晚上放烟花的花火观赏船。\n⏱ 时长：买票上船约 10 分 + 不下船绕中岛航程约 50 分 = 合计约 60 分，对齐 13:30-15:00（夏季每 30 分一班，错过一班等下一班也不慌）。\n👶 带娃·注意：船有 1 楼、2 楼室内甲板，婴儿车可推上船停室内，宝宝坐室内吹不到风、风浪也稳，比户外省心；想看景大人轮流抱宝宝出甲板吹会儿风。船上后方有咖啡小卖部、室内能坐着喂奶（船程仅 50 分，可上船前先喂饱换好尿布）。带宝宝上船建议确认有无婴儿尺寸救生衣。中岛可下船走步道，但带娃 + 赶午后温泉，建议直接坐「不下船 50 分」这班、不下岛。\n⚠ 夏季运营 8:30-16:30、每 30 分一班；湖面起大风浪大时可能停航或缩短，午后去一般无碍，出发前看天气。票价 1,800 日元（约人民币 76 元）/小学 900 日元（约人民币 38 元）。"}, {"time": "15:00-16:30", "title": "⛩ 浮見堂公園（朱红双塔·湖畔散步）", "desc": "📍 **Google Maps 搜「浮見堂公園」**（洞爺湖**北岸**·洞爺町·マップコード 321 789 372）\n🎯 怎么玩：游船看完火山岛，下午换个调性——开到洞爺湖北岸的浮見堂公園，看湖岸细岬上一座**朱红双重塔「浮見堂」**，像浮在湖面上，是**洞爺湖八景**之一（1937 年为供奉圣德太子木像而建）。湖畔是平缓的「波打ち際」、散步气分慢走，和上午缆车的火山俯瞰、游船的火山岛完全不同的**和风静谧湖景**。湖畔也立着「とうや湖ぐるっと彫刻公園」58 座野外雕塑的一部分，边走边看。\n🚶 路线：駅前桟橋下船 → 开车约 **20 分** 到浮見堂公園 → 湖岸散步看浮見堂+雕塑约 40 分 → 原路开车约 20 分回湖畔亭。\n⏱ 时长：往返车程约 40 分 + 湖岸散步约 40 分 ≈ 1.5h，对齐 15:00-16:30。\n👶 带娃·注意：湖岸平缓好推车，婴儿车/背带都行；户外无母婴室→车内/哺乳巾换尿布；傍晚带薄外套、天黑前去。\n🅿 停车免费约 50 台。免费·户外公园随时可看。"}, {"time": "16:30-18:00", "title": "♨ 回湖畔亭·温泉慢活（弹性）", "desc": "浮見堂回来 16:30 到湖畔亭，安顿喂奶、温泉慢活。\n地点：湖畔亭 9 楼空中大浴场 + 屋上空中露天（看洞爺湖+羊蹄山）\n关键：温泉**住宿客 15:00-翌 10:00 随时泡**——不必下午硬挤，夫妻轮流找时段：**这会儿回来 / 晚餐后 / 烟花后 / 翌朝**都行，一人泡一人看娃\n⚠ 无贷切风吕（无私汤），公共浴场轮流泡\n宝宝：8-9 月不泡温泉；或湖畔散步慢活"}, {"time": "18:00", "title": "旅馆 自助餐 晚餐", "desc": "在旅馆会场吃自助晚餐，挑软食喂娃。\n地点：湖畔亭会场\n关键：一泊二食（含早晚餐）含，晚餐 自助餐（同昨晚，北海道食材）\n宝宝：会场有婴儿椅，前台可热辅食"}, {"time": "20:45", "title": "🎆 烟花大会（第2晚）", "desc": "看第二晚烟花，和西式房面湖、房间窗户就能看（**烟花是湖上船放、不被建筑遮挡**）。\n关键：烟花 **20:45** 起约 **20 分**\n注意：两晚都有，第一晚遇雨/强风取消可看这晚补\n宝宝：在房内隔窗看更安静（面湖房，6/17 旅馆确认），宝宝可不出门；出门看才备耳罩"}], "hotel": {"name": "洞爺，湖畔亭（同Day6）"}, "feeding": [{"time": "08:30", "place": "旅馆早餐（出发前喂饱；09:45 出发去缆车）"}, {"time": "11:00", "place": "有珠山缆车 山麓站火山村"}, {"time": "13:15", "place": "海鮮ダイニング龍（午餐）"}, {"time": "16:15", "place": "浮見堂散步后 / 回程车上"}, {"time": "18:00", "place": "旅馆自助餐会场 , "diaper": "湖畔亭房间、海鮮ダイニング龍、缆车山麓站、浮見堂公園（户外→车内/哺乳巾）", "avoid": "宝宝 8-9 月不泡温泉；烟花可在房内隔窗看（面湖房）、出门看才备耳罩", "food_table": []}}, {"n": 8, "date": "2026-07-11", "dow": "周六", "title": "洞爷 → 支笏湖 → 还车回港", "theme": "回机场大路上顺收支笏湖，赶下午HB881——支笏湖在回程线上、只多绕30-40分。", "items": [{"time": "07:00-08:30", "title": "早餐 + 退房", "desc": "早起从容吃早餐，08:00 收拾退房早走。\n地点：洞爷湖畔亭\n怎么做：\n• 早餐 **7:00** 开餐，从容吃\n• **08:00** 收拾退房\n注意：湖畔亭 **10:00** 才退房，但今天要早走赶支笏湖+航班"}, {"time": "08:30-10:10", "title": "🚗 洞爷 → 支笏湖", "desc": "开车回机场方向，顺路下到支笏湖。\n路线：R453 经壮瞥，大滝下到支笏湖\n车程：约 **1h40**（NAVITIME·85km·国道276＋453；死线日按 1h40 留余量、10:10 到）\n导航：跟着走即可（「支笏湖天空之路」道道 16 实为支笏湖→千岁段）"}, {"time": "10:10-11:00", "title": "💎 支笏湖", "desc": "📍 **Google Maps 搜「支笏湖第1駐車場」**（游客中心、游船、湖畔都在这停车场旁）\n🎯 怎么玩：支笏湖是日本透明度数一数二的火口湖，水清得近岸都能看见湖底，晴天呈「支笏湖蓝」。回程顺路只玩湖畔最精华一小圈：在湖畔园地（湖边大草坪 + 长椅）看湖、远眺对岸的恵庭岳/风不死岳，逛湖畔的支笏湖游客中心（免费、有火山与湖的自然展示、可换尿布躲太阳）。带娃 + 赶飞机的「短平快」玩法，看的就是那一汪蓝，10:10 到正好趁中午人潮和大巴上来前。\n🚶 路线：停「支笏湖第 1 停车场」（约 300 台、紧挨游客中心和商店街）→ 下车步行数分钟到湖畔园地看湖、拍蓝湖 → 顺道进支笏湖游客中心看展、换尿布喂奶 → 想看船的话游览船码头也在同一片湖畔、走过去看一眼 → 原路回第 1 停车场上车。围着停车场周边一小圈、不走远。\n⏱ 时长：看湖 + 拍照约 20 分 + 游客中心约 15 分 + 机动/喂奶约 15 分 = 合计约 50 分，正好卡满。硬截止：11:00 必须上车走（后面还要千歲加油约 45 分、12:30 前还车、再坐接驳回航站楼赶 16:05 的 HB881，一环扣一环）。缩短版：娃闹/天气差，只在湖畔站 10 分钟拍张蓝湖照、不进游客中心，10:40 就走更稳；状况很差直接跳过这站、直奔机场（航班是死线）。\n👶 带娃·注意：湖畔园地和游客中心一带是平整步道 + 草坪，婴儿车能推；只有从展望台往南下湖边那段有缓阶梯，推车别硬下、抱一下即可。换尿布/喂奶进支笏湖游客中心（室内、比露天舒服）。爸爸一人看车 + 背娃，建议别贪走湖畔深处的散策林道（费时还赶飞机），就近看蓝湖最划算。\n⚠ 11:00 是硬截止，过点不恋战、赶 16:05 HB881。想坐水中游览船（看湖底柱状节理，大人 2,000 日元约 85 元、小学 1,000 日元约 42 元，单程约 30 分）——加候船时间 11:00 截止下基本来不及，这天别排船；别和洞爺/有珠山的船搞混，这是支笏湖自己的船。停车只停「支笏湖第 1 停车场」（支笏湖温泉駐車場·普通车 500 日元约人民币 21 元·约 300 台·紧挨游客中心·仅收现金），离游客中心最近最方便。游客中心营业 9:00-17:30、免费。"}, {"time": "11:00-12:15", "title": "支笏湖 → 千歲加油 → 新千岁机场", "desc": "回机场路上千岁市内先把油加满。\n路线：支笏湖 → 千歲加油 → 新千岁机场\n车程：约 **45 分**\n导航：コスモ石油 千歳空港SS（**24h**，国道 36 线，距机场 **4.5km**）\n关键：途中千歲市内先把油加满\n🧾 留加油小票当满油证明"}, {"time": "12:15-12:30", "title": "机场还车", "desc": "到柏台南营业所还车，赶接送回航站楼。\n地点：日产租车 新千歳空港店（柏台南营业所，非航站楼）\n导航：日産レンタカー 新千歳空港店\n地址：柏台南 2-2-5　电话 0123-27-4123\n关键：国际线最晚起飞 **2h** 前还车 推车不建议），海拔930m风大给娃备外套", "addr": "美瑛町白金", "tel": "0166-94-3016"}], "Day5 午餐/Day6转场 公路驿站": [{"name": "公路驿站 びえい「丘のくら」（D5午餐）", "pin": "道の駅びえい 丘のくら", "mc": "—", "park": "免费，仅36台（小道の駅，旺季中午可能等位），6-8月9:00-18:00，JR美瑛站步行3分，软石仓库改建，主打轻食/软冰", "addr": "美瑛町本町1", "tel": "0166-92-0920"}, {"name": "公路驿站 宇土内湖（ウトナイ湖）（D6午餐主选）", "pin": "道の駅 ウトナイ湖", "mc": "113 413 623", "park": "免费，93台✅展望塔2F授乳室+kids space+电梯，9:00-18:00，大休息区全玻璃湖景+窗边插座USB，带娃友好⚠偏苫小牧略绕路，宜当『行程中点大休息+喂奶站』", "addr": "苫小牧市植苗156-30", "tel": "0144-58-4137"}, {"name": "公路驿站 伊达历史之杜（だて歴史の杜）（D6午餐备选）", "pin": "道の駅 だて歴史の杜", "mc": "159 780 134*41", "park": "免费，166台，9:00-18:00✅更顺路，更近洞爺（虻田洞爺湖IC前一站），物产馆有快餐/面包/农水产，建议作转场日午餐主选", "addr": "伊达市松ヶ枝町34-1", "tel": "0142-25-5567"}], "Day7 洞爺湖（温泉街3点）": [{"name": "有珠山缆车+昭和新山", "pin": "有珠山ロープウェイ 山麓駅 / 昭和新山", "mc": "321 433 438", "park": "收费，500日元，约人民币21元/日，约400台（山麓火山村），周边多家民营场也统一500日元，停那家都行，停车场直达缆车山麓站几乎零步行，铺装平地推车友好", "addr": "壮瞥町昭和新山184-5", "tel": "0142-75-2401"}, {"name": "海鮮ダイニング龍", "pin": "海鮮ダイニング龍（洞爺湖温泉）", "mc": "（搜「海鮮ダイニング龍」/地址 洞爺湖温泉40-10 导航）", "park": "有停车场（台数未明·行前电话确认）", "addr": "洞爺湖温泉40-10", "tel": "0142-82-3744"}, {"name": "洞爺湖游船（中島めぐり）", "pin": "洞爺湖汽船 駅前桟橋", "mc": "321 518 618*63", "park": "免费，约150台，中島めぐり遊覧船在『駅前桟橋』（温泉36-4，ホテルグランドトーヤ后侧）⚠别停看花火船的『本社前桟橋』，导航认准『洞爺湖汽船 駅前桟橋』，与わかさいも同在温泉街可推车走过去", "addr": "洞爺湖温泉36-4", "tel": "0142-75-2137"}], "Day8 支笏湖+还车加油": [{"name": "支笏湖第1駐車場（游客中心+游船+湖畔）", "pin": "支笏湖第1駐車場", "mc": "867 063 659*28", "park": "收费，500日元，约人民币21元/日（12-3月免），约300台，游客中心『支笏湖ビジターセンター』+游船『支笏湖観光船』+湖畔散策道全在脚边徒步数分，推车平地友好⚠协力金500日元/人只针对『みなもあパーク』水辺利用者，你们停第1场逛湖不付协力金（别停みなもあパーク那个36台贵场）", "addr": "千歳市支笏湖温泉", "tel": "0123-25-2404"}, {"name": "🛢 千歳加油（还车前满油）", "pin": "コスモ石油 千歳空港SS", "mc": "—", "park": "24h自助，千歳朝日町8，国道36线回程顺路，距机场约4.5km，机场周边几乎无加油站务必在此加满，🧾务必留加油小票（满油证明，还车要交）", "addr": "千歳市朝日町8-1206-63", "tel": "0123-23-2324"}, {"name": "日産租车 新千歳空港店（还车）", "pin": "日産レンタカー 新千歳空港店", "mc": "—", "park": "导航到柏台南营业所（非航站楼柜台），还车办手续→免费送迎巴士到航站楼（约5-15分），夏季营业到21:00", "addr": "千歳市柏台南2-2-5", "tel": "0123-27-4123"}]}, "driving_japan": {"title": "🚗 日本驾车提醒", "intro": "你一直在大陆开车（左舵·靠右），日本是右舵·靠左，头几天最不适应。出发前过一遍，路上随时翻这页。", "sections": [{"title": "🔑 头三天最容易出糗（先记死这 3 条）", "level": "warn", "items": ["**右舵车**：方向盘在右、你坐车右边。左侧车宽完全没感觉，最容易蹭左侧、压左线——靠左行驶但别太贴左边。", "**雨刷和转向灯杆左右相反**：转向灯在右手、雨刷在左手（跟大陆正好反）。想打转向灯结果刷了雨刷，是头三天最高频的糗事——拐弯前慢一拍、看一眼手。", "**全程靠左行驶**：转弯后一定拐进**左侧**车道，别习惯性拐进右道（=逆行，最危险）；环岛逆时针走；超车走右道、平时一直靠左。"]}, {"title": "🚦 核心规则（违了要罚 / 被警察抓）", "level": "normal", "items": ["**红灯禁止一切转向**：红灯就是停，不能像大陆那样红灯转弯。只有亮**绿色箭头**才能按箭头方向走。", "**「止まれ」(stop) 必须完全停**：见红色倒三角「止まれ」或路面停止线，**脚刹完全停住、停 3 秒、看左右再走**，不能滑过去——日本查得严、常有警察蹲点。", "**行人 / 自行车绝对优先**：斑马线只要有人（哪怕在等），必须停车让行；路口转弯让横过的行人。撞了责任几乎全在你。", "**铁道口（踏切）每个都要停**：到铁道口**必须完全停车**、看左右确认无电车再过，即使没栏杆没声音也要停。", "**限速**：一般道路多为 50-60、市区/生活道路 30-40、高速 100（一切以现场蓝底 km/h 标识为准）。北海道路宽车少最容易超速，**沿途有自动测速（オービス）**，别飙。", "**绝对不能**：酒后驾驶（隔夜酒也算）、开车碰手机/导航（要操作先靠边停）。这两条日本罚得极重、可拘留。"]}, {"title": "🦌 北海道特别注意", "level": "warn", "items": ["**野生动物突然窜出**：北海道山路、农村路、黄昏和清晨，**鹿（エゾシカ）/狐狸会冲上马路**——撞鹿是这里租车最常见事故。你去神威岬、富良野美瑛、洞爺的山路尤其注意，见黄色「動物注意」牌就减速。", "**长直路别被催眠超速**：北海道很多笔直长路、信号少，容易不知不觉超速 + 走神，开定速也要盯着。", "**加油站偏远地区少、晚上早关**：山区/转场段按行程在市区先加满（你的 Day4 傍晚富良野、Day8 千歲已安排）。", "**停车位偏小、多倒车入库（バック駐車）**：先照 PDF 说的「感受车宽、调好后视镜」，慢点倒。"]}, {"title": "👶 带娃 + 安全（你是唯一司机）", "level": "normal", "items": ["**儿童座椅是法定的**：日本规定 **6 岁以下必须用儿童约束装置**——宝宝全程坐你租的后向婴儿座椅，**不能抱在腿上坐车**（抱着出事 + 被查都麻烦）。", "**全员系安全带**（日产三要求之一：系安全带、勤确认、减速行驶）。", "**唯一司机 + 带娃**：累了/宝宝闹就找道の駅（公路驿站）停下歇，别硬撑；喂奶换尿布一律停车进行（你的行程已是这个节奏）。"]}, {"title": "⛽ 加油（KICKS 加什么油千万别错）", "level": "warn", "items": ["**KICKS e-POWER 加普通汽油「レギュラー」(红色油枪)**——它是汽油发电的混动，加汽油、不是充电。**千万别加「軽油」(绿枪=柴油)**，加错毁发动机、维修费你赔；高级汽油「ハイオク」(黄枪)也不必要。", "**还车前必须加满油**、留好**加油小票**（还车要出示）；没加满日产按里程收费、比自己加贵不少。", "自助加油（セルフ）：选红枪「レギュラー」→ 触摸静电消除 → 加到跳枪 →（部分站先在机器付款）。不确定就找有人服务的站，说「満タン、レギュラー」(mǎn tǎn·加满普通汽油)。"]}, {"title": "🛣️ 高速 / ETC", "level": "normal", "items": ["你的车有 **ETC 卡**：走收费站标「**ETC専用**」或「ETC/一般」的门，**别走只写「一般」的人工门**；过 ETC 门**减速到 20km/h 以下**慢慢过、栏杆自动抬。", "万一 ETC 没读到/走错道，**别急停别倒车**，停下按门边对讲机找工作人员。"]}, {"title": "🆘 出事故 / 故障怎么办", "level": "warn", "items": ["**任何事故先做 3 件事**：① 车移到安全处、开双闪；② 打 **110 报警**（有人受伤打 **119**）；③ 一定拿到警察的「**事故证明**」——没有它保险不赔。", "**再联系**：保险事故中心(Sompo Japan) **0120-256-110**(24h，打不通拨 0422-35-4219)；车坏/爆胎找 **JAF 道路救援 #8139**(或 0570-00-8139)；也可问租车店 **0123-27-4123**。", "**别私了**（日产明确禁止私下和解）。即使买了全险，事故致车停修仍要付**营业损失费 NOC**(小损 ≤5 万、大损 ≤10 万日元)。", "外籍客户疑难(非事故)：日产外籍咨询室 **03-6625-8290**。"]}, {"title": "🛡️ 你买的保险（全面支援·0 自负额）", "level": "normal", "items": ["你选的是「**全面支援方案**」，事故**自负额 0 日元**——撞了/剐了不用自掏免赔额，这钱花得对、别心疼。", "**但保险不覆盖**：爆胎、车内设备/物品丢失损坏、轮毂盖丢失、个人疏忽导致电瓶没电等——这些得自己掏，所以**别忘关灯、别乱拆设备、停好拉手刹**。"]}]}, "alternatives": [{"name": "风之花园", "area": "D3（已砍）", "core": "英式庭园（约2万株/365种花，《风之花园》剧外景地）", "reason": "绕到最南端40分车程 + 卡16:30最终受付 + 与上午两片薰衣草重复"}, {"name": "十勝岳温泉郷", "area": "上富良野八景8 / D3方向2", "core": "1280m·安政火口喷烟 + 十勝岳连峰高山近景", "reason": "与D5望岳台同为十勝岳火山高山 + 上山绕又耗时 + 宝宝不泡汤"}, {"name": "深山峠", "area": "上富良野八景2", "core": "错觉艺术馆拍照 + 地上50m观览车俯瞰十勝岳", "reason": "主体是打卡设施(美术馆1300日元) + 免费展望又与D3千望峠/过山车重复"}, {"name": "和田草原とどんぐりの郷", "area": "上富良野八景6", "core": "草原 + 十勝岳连峰到夕张岳全景眺望", "reason": "道道291偏(不顺任何兜风) + 极小众难找 + 维度重复"}, {"name": "旭野やまびこ高地", "area": "上富良野八景7", "core": "十勝岳近景眺望 + 喊话回声(やまびこ)", "reason": "道道291偏 + 小众隐藏 + 维度重复"}, {"name": "超広角の路（攻略环线）", "area": "美馬牛→上富良野", "core": "国道237丘陵田园兜风(沿途圣诞树/菅野农场/过山车之路/深山峠/四季彩)", "reason": "绕出美瑛 + 撞D3过山车之路·D4四季彩；想要的超广角全景D5新栄の丘已含"}, {"name": "北星山ラベンダー園", "area": "中富良野", "core": "薰衣草缆车5分半上山 + 山顶薰衣草坡/十勝岳/中富良野盆地", "reason": "第5个薰衣草、缆车看的也全重复(顺路便宜但无新意)"}, {"name": "チーズ工房 gelato", "area": "原D5（已移除·16:30启程赶不上 Cheese Factory 17:00 关）", "core": "哈斯卡普(ハスカップ)gelato + 富良野产手作冰", "reason": "吃冰=消费休闲、和咖啡馆同类"}]};
const $ = (id) => document.getElementById(id);
let curDay = 1;

function esc(t){return (t==null?'':String(t)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtLine(s){s=s.replace(/^(一句话|地点|导航|地址|怎么做|关键|营业|费用|耗时|停车|宝宝|注意|可选|备选|路线|起点|终点|车程|距离|高速费|推荐路线)(：)/,'<b class="lb">$1$2</b>');return s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');}
function fmtDesc(d){let t=esc(d);t=t.replace(/\s*(⚠|🚨|▸|💡|✅)/g,'\n$1');return t.split(/[。；;\n]+/).map(s=>s.trim()).filter(Boolean).map(fmtLine).join('<br>');}

function init(){
  $('ttl').textContent = STATE.trip.name;
  const f = STATE.flights;
  $('sub').textContent = `${f[0].date} ${f[0].fromTime}出发 · ${f[1].date} ${f[1].toTime}回港 · 自驾`;
  // day tabs
  const dt = $('daytabs'); dt.innerHTML='';
  STATE.days.forEach(d=>{
    const b=document.createElement('button'); b.className='daytab'+(d.n===curDay?' on':'');
    b.innerHTML=`${d.n===0?'前夜':'D'+d.n}<small>${d.date.slice(5)} ${d.dow}</small>`;
    b.onclick=()=>{curDay=d.n; renderItin(); [...dt.children].forEach(c=>c.classList.remove('on')); b.classList.add('on');};
    dt.appendChild(b);
  });
  renderItin(); renderWeather(); renderNav(); renderDrive(); renderHotels(); renderFood(); renderBaby(); renderFallbacks(); renderTodos(); renderSos();
  // nav
  document.querySelectorAll('#nav button').forEach(btn=>{
    btn.onclick=()=>{
      document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('on'));
      btn.classList.add('on');
      document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
      $('v-'+btn.dataset.v).classList.add('on');
      $('daytabs').classList.toggle('hide', btn.dataset.v!=='itin');
      if(btn.dataset.v==='itin' && window.LMAP){ setTimeout(()=>{try{window.LMAP.invalidateSize();}catch(e){}},80); }
      window.scrollTo(0,0);
    };
  });
}

function renderDayMap(d){
  if(window.LMAP){try{window.LMAP.remove();}catch(e){} window.LMAP=null;}
  const pts=(d.map||[]); if(!pts.length || !window.L || !document.getElementById('daymap')) return;
  const map=L.map('daymap',{zoomControl:true,attributionControl:false,scrollWheelZoom:false});
  window.LMAP=map;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:17,crossOrigin:true}).addTo(map);
  const kc={hotel:'#5b4b8a',sight:'#1a7a8a',food:'#d35400',transit:'#1a5276'};
  const ll=[];
  pts.forEach((p,i)=>{
    const c=kc[p.kind]||'#555';
    const ic=L.divIcon({className:'',iconSize:[24,24],iconAnchor:[12,12],html:
      `<div style="background:${c};color:#fff;width:24px;height:24px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.45)"><span style="transform:rotate(45deg);font-size:12px;font-weight:700">${i+1}</span></div>`});
    L.marker([p.lat,p.lng],{icon:ic}).addTo(map).bindPopup(`${i+1}. ${esc(p.label)}`);
    ll.push([p.lat,p.lng]);
  });
  if(ll.length>1) L.polyline(ll,{color:'#5b4b8a',weight:3,opacity:.55,dashArray:'7,7'}).addTo(map);
  const fit=()=>{ try{ if(ll.length>1) map.fitBounds(L.latLngBounds(ll),{paddingTopLeft:[34,34],paddingBottomRight:[34,34],maxZoom:13}); else map.setView(ll[0],12); }catch(e){ map.setView(ll[0]||[43,142],9); } };
  fit();
  // 容器尺寸/瓦片稳定后再 invalidateSize+重新 fit, 防止首帧高度未定导致 marker 被切到框外
  setTimeout(()=>{ try{ map.invalidateSize(); fit(); }catch(e){} },200);
  setTimeout(()=>{ try{ map.invalidateSize(); fit(); }catch(e){} },550);
}

function renderItin(){
  const d = STATE.days.find(x=>x.n===curDay); if(!d)return;
  let h = '';
  if(d.map&&d.map.length){
    const kc={hotel:'#5b4b8a',sight:'#1a7a8a',food:'#d35400',transit:'#1a5276'};
    const leg = d.map.map((p,i)=>`<span style="white-space:nowrap"><span class="dot" style="background:${kc[p.kind]||'#555'}"></span><b>${i+1}</b> ${esc(p.label)}</span>`).join('');
    h += `<div class="mapwrap"><div id="daymap" class="daymap"></div><div class="maplegend">${leg}</div><div class="mapnote">🟣住宿 🟢景点 🟠餐饮 🔵交通 · 可缩放拖动 · 精确导航名见「🧭导航」页</div></div>`;
  }
  h += `<div class="theme">📍 ${fmtDesc(d.theme)}</div>`;
  if(d.oneliner) h += `<div class="oneliner">📝 今日：${esc(d.oneliner)}</div>`;
  if(d.warning) h += `<div class="warn">${fmtDesc(d.warning)}</div>`;
  if(d.overview&&d.overview.length){
    h += '<div class="ovbox"><div class="ovh">⏱ 今日时间线总览</div><table class="ovt"><tbody>';
    d.overview.forEach(o=>{ h += `<tr><td class="ovt-t">${esc(o.time)}</td><td>${esc(o.do||'')}<span class="ovt-l">${esc(o.loc||'')}</span></td><td class="ovt-tip">${esc(o.tip||'')}</td></tr>`; });
    h += '</tbody></table></div>';
  }
  h += '<div class="tl">';
  (d.items||[]).forEach(it=>{
    h += `<div class="item"><div class="time">${esc(it.time)}</div><div class="ic"><div class="t">${esc(it.title)}</div>`+
         (it.desc?`<div class="d">${fmtDesc(it.desc)}</div>`:'')+`</div></div>`;
  });
  h += '</div>';
  if(d.confirm&&d.confirm.length){
    h += '<div class="chk"><div class="chkh">✅ 今日必须确认</div>';
    d.confirm.forEach(c=> h += `<div class="chki">☐ ${esc(c)}</div>`);
    h += '</div>';
  }
  if(d.risks&&d.risks.length){
    h += '<div class="warn"><b>⚠ 今日风险点</b><br>'+d.risks.map((r,i)=>`${i+1}. ${esc(r)}`).join('<br>')+'</div>';
  }
  if((d.feeding&&d.feeding.length)||d.baby_daily){
    const bd = d.baby_daily||{};
    h += '<div class="baby"><div class="babyh">🍼 宝宝当日重点</div>';
    if(bd.prepare) h += `<div class="babi"><b>提前准备：</b>${esc(bd.prepare)}</div>`;
    if(bd.buy) h += `<div class="babi"><b>当天要买：</b>${esc(bd.buy)}</div>`;
    if(d.feeding&&d.feeding.length){
      h += '<div class="babi"><b>喂奶 / 换尿布点：</b></div>';
      d.feeding.forEach(fd=> h += `<div class="babf">• ${esc(fd.time)}　${esc(fd.place)}</div>`);
    }
    if(bd.diaper) h += `<div class="babi"><b>哺乳换尿布方便点：</b>${esc(bd.diaper)}</div>`;
    if(bd.avoid) h += `<div class="babi" style="color:#c0392b"><b>需避免：</b>${esc(bd.avoid)}</div>`;
    if(bd.food_table&&bd.food_table.length){
      h += '<div class="babi"><b>辅食采购表：</b></div><table class="ft"><thead><tr><th>类型</th><th>商品 / 关键词</th><th>能买?</th><th>注意</th></tr></thead><tbody>';
      bd.food_table.forEach(r=> h += `<tr><td>${esc(r.type||'')}</td><td>${esc(r.item||'')}</td><td>${esc(r.ok||'')}</td><td>${esc(r.note||'')}</td></tr>`);
      h += '</tbody></table>';
    }
    h += '</div>';
  }
  if(d.hotel&&d.hotel.name) h += `<div class="feed" style="background:#f0eef7"><h3 style="color:#5b4b8a">🏨 今晚</h3><div style="color:#5b4b8a">${esc(d.hotel.name)}</div></div>`;
  $('v-itin').innerHTML = h;
  renderDayMap(d);
}

function renderNav(){
  let h = '';
  const bsm = STATE.bookings_summary || {};
  if(bsm.flights){
    h += '<div class="sec-title">✈️ 机票</div>';
    bsm.flights.forEach(f=>{ h += `<div class="card"><h3>${esc(f.leg)}　${esc(f.date)}　${esc(f.flight)}</h3><div class="meta">${esc(f.route)}\n${esc(f.note||'')}</div></div>`; });
  }
  const r = bsm.rental;
  if(r){
    h += '<div class="sec-title">🚗 租车</div>';
    h += `<div class="card"><h3>${esc(r.company)}</h3><div class="meta">${esc(r.car)} · ${esc(r.ref)}\n取车 ${esc(r.pickup)}\n还车 ${esc(r.ret)}\n${esc(r.price)}\n${esc(r.docs)}\n📍 ${esc(r.address)}</div></div>`;
  }
  const nav = STATE.nav_parking || {};
  for(const grp in nav){
    h += `<div class="sec-title">${esc(grp)}</div>`;
    (nav[grp]||[]).forEach(p=>{
      const tel = (p.tel && p.tel!=='—') ? ' · '+esc(p.tel) : '';
      const pinL = p.pin ? `<b style="color:#5b4b8a">📍 导航搜「${esc(p.pin)}」</b><br>` : '';
      h += `<div class="card"><h3>${esc(p.name)}</h3><div class="meta">${pinL}🅿️ ${fmtDesc(p.park||'')}<br>🏠 ${esc(p.addr||'')}${tel}</div></div>`;
    });
  }
  $('v-nav').innerHTML = h;
}

function renderDrive(){
  const g = STATE.driving_japan; if(!g){ $('v-drive').innerHTML=''; return; }
  let h = `<div class="sec-title">${esc(g.title||'日本驾车提醒')}</div>`;
  if(g.intro) h += `<div class="warn" style="font-size:13px">⚠ ${esc(g.intro)}</div>`;
  (g.sections||[]).forEach(sec=>{
    const warn = sec.level==='warn';
    h += `<div class="card"${warn?' style="border-left:4px solid var(--warn)"':''}><h3>${esc(sec.title)}</h3><div class="meta">`+
      (sec.items||[]).map(it=>'• '+fmtLine(esc(it))).join('<br>')+`</div></div>`;
  });
  $('v-drive').innerHTML = h;
}

function renderWeather(){
  const w = STATE.weather; if(!w){ $('v-weather').innerHTML=''; return; }
  let h = `<div class="sec-title">${esc(w.title||'天气')}</div>`;
  h += `<div class="warn" style="font-size:12px">🕐 ${esc(w.updated||'')}｜源：${esc(w.sources||'')}<br>${esc(w.reliability||'')}</div>`;
  (w.days||[]).forEach(d=>{
    h += `<div class="card"><h3>${esc(d.day)} ${esc(d.date)} ${esc(d.area)} <span class="tag">${esc(d.verdict||'')}</span></h3><div class="meta"><b class="lb">tenki.jp：</b>${esc(d.tenki||'')}<br><b class="lb">Weathernews：</b>${esc(d.wn||'')}<br><b class="lb">国际：</b>${esc(d.third||'')}</div></div>`;
  });
  if(w.summary){ h += '<div class="sec-title">三源结论</div><div class="card"><div class="meta">'+(w.summary||[]).map(s=>fmtLine(esc(s))).join('<br><br>')+'</div></div>'; }
  $('v-weather').innerHTML = h;
}

function renderHotels(){
  let h='<div class="sec-title">住宿安排</div>';
  (STATE.hotels||[]).forEach(ho=>{
    h+=`<div class="card"><h3>${esc(ho.name||'')}</h3><div class="meta">`+
       (ho.night?`📅 ${esc(ho.night)}\n`:'')+(ho.room?`🛏 ${esc(ho.room)}\n`:'')+
       (ho.price?`💴 ${esc(ho.price)}\n`:'')+(ho.note?fmtDesc(ho.note):'')+`</div></div>`;
  });
  $('v-hotel').innerHTML=h;
}

function renderFood(){
  let h='<div class="sec-title">餐厅推荐（人均≤人民币400元，海胆季/会席例外）</div>';
  (STATE.restaurants||[]).forEach(r=>{
    h+=`<div class="card"><h3>${esc(r.name||'')} <span class="tag">${esc(r.type||'')}</span></h3>`+
       `<div class="meta"><span class="tag">${esc(r.day||'')}</span><span class="tag">${esc(r.price||'')}</span><br>${fmtDesc(r.note||'')}</div></div>`;
  });
  $('v-food').innerHTML=h;
}

function renderBaby(){
  const g = STATE.baby_food_guide; if(!g){ $('v-baby').innerHTML=''; return; }
  const st = g.baby_status||{};
  let h = `<div class="sec-title">${esc(g.title||'宝宝辅食采购攻略')}</div>`;
  h += '<div class="card"><h3>📊 宝宝现在到哪了</h3><div class="meta">';
  if(st.age_at_trip) h += `🎂 ${esc(st.age_at_trip)}\n`;
  if(st.texture) h += `🥄 ${esc(st.texture)}\n`;
  if(st.frequency) h += `⏰ ${esc(st.frequency)}`;
  h += '</div>';
  if(st.tried){
    let tr='';
    for(const k in st.tried){ tr += `\n${esc(k)}：${(st.tried[k]||[]).map(esc).join('、')}`; }
    h += `<div class="meta" style="margin-top:8px"><b style="color:#1a7a8a">✅ 已吃过</b>${tr}</div>`;
  }
  if(st.allergen_done) h += `<div class="meta" style="margin-top:6px;color:#1a7a8a">致敏原已引入：${(st.allergen_done||[]).map(esc).join(' / ')}</div>`;
  if(st.allergen_todo) h += `<div class="meta" style="color:#c0392b">没吃过，别首试：${(st.allergen_todo||[]).map(esc).join(' / ')}</div>`;
  h += '</div>';
  if(g.iron_rule) h += `<div class="warn">🚨 ${fmtDesc(g.iron_rule)}</div>`;
  if(g.buy_safe){
    h += '<div class="sec-title">✅ 放心买（对应已吃口味）</div>';
    g.buy_safe.forEach(b=>{ h += `<div class="card"><h3>${esc(b.cat)}</h3><div class="meta">${fmtDesc(b.why||'')}<br>👉 ${fmtDesc(b.pick||'')}</div></div>`; });
  }
  if(g.avoid){
    h += '<div class="card" style="border-left:4px solid var(--warn)"><h3>⚠ 看成分避开 / 谨慎</h3><div class="meta">'+(g.avoid||[]).map(a=>'· '+esc(a)).join('\n')+'</div></div>';
  }
  if(g.qty_heat) h += `<div class="card"><h3>📦 数量 & 加热</h3><div class="meta">${fmtDesc(g.qty_heat)}</div></div>`;
  if(g.buy_where) h += `<div class="card"><h3>🛒 哪里买</h3><div class="meta">${fmtDesc(g.buy_where)}</div></div>`;
  if(g.before_departure) h += `<div class="card" style="background:#fff8e8"><h3>💡 出发前在家（可选）</h3><div class="meta">${fmtDesc(g.before_departure)}</div></div>`;
  if(g.source) h += `<div class="meta" style="font-size:11px;color:#999;margin-top:10px">📋 ${esc(g.source)}</div>`;
  $('v-baby').innerHTML = h;
}

function renderFallbacks(){
  let h='<div class="sec-title">天气 / 突发 备选</div>';
  (STATE.fallbacks||[]).forEach(fb=>{
    h+=`<div class="card"><h3>${esc(fb.trigger||'')}</h3><div class="meta"><b>→ ${esc(fb.action||'')}</b><br>${fmtDesc(fb.detail||'')}</div></div>`;
  });
  if(STATE.alternatives&&STATE.alternatives.length){
    h+='<div class="sec-title">📋 已评估·决定不去（点开看为什么）</div>';
    STATE.alternatives.forEach(a=>{
      h+=`<div class="card"><h3>${esc(a.name)} <span class="tag">${esc(a.area)}</span></h3><div class="meta"><b class="lb">核心看什么：</b>${esc(a.core)}<br><b style="color:#c0392b">✗ 不去：</b>${esc(a.reason)}</div></div>`;
    });
  }
  $('v-fb').innerHTML=h;
}

function renderTodos(){
  let h='<div class="sec-title">出发前清单</div>';
  (STATE.predeparture_todo||[]).forEach(t=>{
    h+=`<div class="todo"><span class="bx">${t.done?'✅':'⬜'}</span><span>${esc(t.label)}</span></div>`;
  });
  if(STATE.packing&&STATE.packing.length){
    h+='<div class="sec-title">行李</div>';
    STATE.packing.forEach(c=>{ h+=`<div class="card"><h3>${esc(c.cat)}</h3><div class="meta">${(c.items||[]).map(esc).join('\n')}</div></div>`; });
  }
  $('v-todo').innerHTML=h;
}

function renderSos(){
  const e=STATE.emergency||{};
  let h='<div class="sec-title">紧急联系</div><div class="card"><div class="meta">'+
    `🚓 警察 ${esc(e.police||'110')}\n🚑 救护/火灾 ${esc(e.ambulance||'119')}\n`+
    `🏛 中国驻札幌总领事馆 ${esc(e.embassy||'')}\n`+
    (e.local_contact?`🚗 ${esc(e.local_contact.name||'')} ${esc(e.local_contact.phone||'')}\n`:'')+
    `🛡 保险 ${esc(e.insurance_24h||'（出发前填）')}</div></div>`;
  $('v-sos').innerHTML=h;
}

init();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }
</script>
</body>
